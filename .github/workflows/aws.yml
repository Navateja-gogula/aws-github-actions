name: CI/CD Pipeline for React App

on:
  push:
    branches:
      - dev
      - test
      - prod

jobs:
  # Job for building the app
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build React App
        run: npm run build

  # Job for deployment to AWS S3 and CloudFront
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync ./public s3://actions-aws --delete

  # Job to promote code from dev to prod branch
  promote-to-prod:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Git configuration
        run: |
          git config --global user.name "Navateja-gogula"
          git config --global user.email "ngogula@anergroup.com"

      - name: Checkout prod branch
        run: |
          git fetch origin
          git checkout prod

      - name: Merge dev into prod
        run: |
          git merge dev

      - name: Push changes to prod branch
        run: |
          git push origin prod

  # Optionally notify upon successful deploy to prod (slack, email, etc.)
  notify-prod-deploy:
    needs: promote-to-prod
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'
    steps:
      - name: Notify on successful deployment
        run: |
          echo "Deployment to production was successful!"
          # Example: send email or Slack notification here

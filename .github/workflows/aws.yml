name: CI/CD Pipeline for React App

on:
  push:
    branches:
      - dev
      - test
      - prod

jobs:
  ci_cd_pipeline:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run tests
      - name: Run tests
        run: npm test -- --watchAll=false

      # Step 5: Build React App
      - name: Build React App
        run: npm run build

      # Step 6: Configure AWS Credentials for deployment
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 7: Deploy to AWS S3
      - name: Deploy to S3
        run: |
          aws s3 sync ./public s3://actions-aws --delete

      # Step 8: Promote to prod branch (only if pushed to dev)
      - name: Promote to prod branch
        if: github.ref == 'refs/heads/dev'
        run: |
          git config --global user.name "Navateja-gogula"
          git config --global user.email "ngogula@anergroup.com"
          git fetch origin
          git checkout prod
          # Automatically resolve conflicts by choosing 'ours' (or 'theirs')
          git merge --allow-unrelated-histories dev || git checkout --ours . && git add . && git commit -m "Auto-resolve merge conflicts" || git checkout --theirs . && git add . && git commit -m "Auto-resolve merge conflicts"
          git push origin prod

      # Step 9: Notify upon successful deployment (optional)
      - name: Notify on successful deployment
        if: github.ref == 'refs/heads/prod'
        run: |
          echo "Deployment to production was successful!"
          # Example: send email or Slack notification here
